name: Verify incident desk with Claude
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desk-claude-verification
  cancel-in-progress: false
jobs:
  record:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Call Claude and verify the resulting MCP evidence
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIVEWHYS_MODEL: ${{ vars.FIVEWHYS_MODEL }}
        run: python scripts/record_desk_provider.py claude "$RUNNER_TEMP/claude-desk.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: claude-desk
          path: ${{ runner.temp }}/claude-desk.json
          if-no-files-found: ignore
