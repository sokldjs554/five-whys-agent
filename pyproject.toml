[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fivewhys-agent"
version = "0.1.0"
description = "Five Whys Agent — LLM 에이전트 기반 장애 로그 근본원인분석(RCA) 자동화"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sokldjs554" }]
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.5",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "langgraph==1.2.24",
    "mcp==1.30.0",
]

[project.optional-dependencies]
desk-encoder = ["onnxruntime>=1.20,<2", "tokenizers>=0.20,<1"]
desk-cache = ["redis>=5,<7"]
mcp = ["mcp==1.30.0"]
es = ["elasticsearch>=8.12"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
fivewhys = "fivewhys.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fivewhys = ["data/postmortems/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
